services:
  - type: web
    name: segundo-turno-ao-vivo
    env: node
    plan: free
    region: ohio
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DISABLE_BACKGROUND_TIMER
        value: false
